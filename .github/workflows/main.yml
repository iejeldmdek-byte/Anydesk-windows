
name: AnyDesk Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download AnyDesk
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "Installer download failed."
          }

          $file = Get-Item $installer
          Write-Host "File size: $($file.Length) bytes"

          $signature = Get-AuthenticodeSignature $installer
          Write-Host "Signature status: $($signature.Status)"

          if ($signature.SignerCertificate) {
            Write-Host "Publisher: $($signature.SignerCertificate.Subject)"
          }

          Get-FileHash $installer -Algorithm SHA256

      - name: Inspect installer help
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "AnyDesk.exe"

          Write-Host "Testing whether the installer starts."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "--help" `
            -Wait `
            -PassThru `
            -ErrorAction SilentlyContinue

          if ($process) {
            Write-Host "Exit code: $($process.ExitCode)"
          } else {
            Write-Host "The installer could not be started."
          }

      - name: Check installation state
        shell: pwsh
        run: |
          $paths = @(
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe",
            "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe",
            "$env:LOCALAPPDATA\AnyDesk\AnyDesk.exe"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "Found AnyDesk at: $path"
            }
          }

          Get-Process -Name AnyDesk `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Id, Path

          Write-Host "GitHub runner is temporary."
          Write-Host "This diagnostic does not create a remote ID."
          
