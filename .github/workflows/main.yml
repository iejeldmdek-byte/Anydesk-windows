
name: AnyDesk Setup Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anydesk-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download AnyDesk
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "AnyDesk download failed."
          }

          Write-Host "AnyDesk installer downloaded."

      - name: Check Windows environment
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion,
                          OsBuildNumber

          Write-Host "Runner is temporary."
          Write-Host "No unattended remote access configured."
          
