
name: Check Windows Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Identify Windows version
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion,
                          OsBuildNumber

          Write-Host "Runner is temporary."
          Write-Host "This is not a native Windows 10 runner."
          
