
name: AnyDesk Install Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anydesk-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download AnyDesk
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "Download failed."
          }

          Write-Host "Installer downloaded."

      - name: Try installing AnyDesk
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "AnyDesk.exe"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "--version" `
            -Wait `
            -PassThru

          Write-Host "AnyDesk process exit code: $($process.ExitCode)"

      - name: Check AnyDesk process
        shell: pwsh
        run: |
          $process = Get-Process -Name "AnyDesk" `
            -ErrorAction SilentlyContinue

          if ($process) {
            Write-Host "AnyDesk process detected."
          } else {
            Write-Host "AnyDesk GUI or service is not running."
          }

          Write-Host "GitHub runner is temporary."
          
